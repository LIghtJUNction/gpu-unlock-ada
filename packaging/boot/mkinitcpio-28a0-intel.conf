# Optional profile for the owner's 1d05:1274 AD107M + Alder Lake i915 laptop.
source /usr/share/doc/gpu-unlock/mkinitcpio-experimental.conf
_gu_gpu=/sys/bus/pci/devices/0000:01:00.0
_gu_igpu=/sys/bus/pci/devices/0000:00:02.0
if [[ ! -r $_gu_gpu/device || ! -r $_gu_igpu/device ||
      $(<"$_gu_gpu/vendor") != 0x10de ||
      $(<"$_gu_gpu/device") != 0x28a0 ||
      $(<"$_gu_gpu/subsystem_vendor") != 0x1d05 ||
      $(<"$_gu_gpu/subsystem_device") != 0x1274 ||
      $(<"$_gu_gpu/revision") != 0xa1 ||
      $(<"$_gu_igpu/vendor") != 0x8086 ||
      $(<"$_gu_igpu/device") != 0x4688 ||
      $(readlink -f "$_gu_igpu/driver") != */i915 ]]; then
    echo 'The 28a0-intel image profile requires 1d05:1274 rev a1 and Intel 8086:4688 bound to i915.' >&2
    return 1
fi
# Keep the actual Intel display driver while excluding unused nouveau and its
# large firmware set from this image. Stock system configuration is untouched.
MODULES=(i915 "${MODULES[@]}")
_gu_hooks=()
for _gu_hook in "${HOOKS[@]}"; do
    [[ $_gu_hook == kms ]] || _gu_hooks+=("$_gu_hook")
done
HOOKS=("${_gu_hooks[@]}")
MODULES_DECOMPRESS=yes
COMPRESSION=zstd
COMPRESSION_OPTIONS=(-T2 -12 --long=27)
unset _gu_gpu _gu_igpu _gu_hooks _gu_hook
