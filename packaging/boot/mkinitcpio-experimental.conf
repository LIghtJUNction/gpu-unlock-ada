# Explicit -c disables automatic drop-ins, so reproduce the installed stock
# configuration before adding the experimental module to this image only.
source /etc/mkinitcpio.conf
for _gu_config in /etc/mkinitcpio.conf.d/*.conf; do
    [[ -f $_gu_config ]] && source "$_gu_config"
done
source /usr/share/doc/gpu-unlock/mkinitcpio.conf
unset _gu_config
